<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Névoa de Viamor — Criaturas</title>
<style>
  :root{
    --console:#2c2440;
    --console-alto:#3d3357;
    --fundo:#151222;
    --tecla:#4a3f6b;
    --tecla-ativa:#6f5fa8;
    --texto:#d8ccff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(circle at 50% 20%, #241d38, var(--fundo));
    color:var(--texto);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:16px;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  #console{
    background:linear-gradient(180deg,var(--console-alto),var(--console));
    border-radius:18px;
    padding:14px;
    box-shadow:0 18px 40px -20px #000, inset 0 1px 0 rgba(255,255,255,0.08);
    border:1px solid #4a3f6b;
  }
  #palco{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0912;
    border-radius:6px;
    padding:6px;
    width:min(92vw, 720px);
    height:min(56vw, 480px);
  }
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
    background:#000;
  }
  #legenda{
    font-size:12px;
    letter-spacing:0.04em;
    opacity:0.75;
    text-align:center;
    line-height:1.6;
  }
  #legenda b{color:#fff;font-weight:600;}
  #touch{
    display:none;
    width:min(92vw,720px);
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }
  .dpad{
    display:grid;
    grid-template-columns:repeat(3,44px);
    grid-template-rows:repeat(3,44px);
  }
  .dpad [data-botao]{grid-area:auto;}
  .dpad .cima{grid-column:2;grid-row:1;}
  .dpad .esq{grid-column:1;grid-row:2;}
  .dpad .dir{grid-column:3;grid-row:2;}
  .dpad .baixo{grid-column:2;grid-row:3;}
  .acoes{display:flex;gap:12px;align-items:center;}
  [data-botao]{
    background:var(--tecla);
    color:#fff;
    border:1px solid #7a68b8;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:600;
    width:44px;
    height:44px;
    cursor:pointer;
  }
  [data-botao]:active{background:var(--tecla-ativa);}
  .acoes [data-botao]{border-radius:50%;width:52px;height:52px;}
  @media (max-width:820px), (pointer:coarse){
    #touch{display:flex;}
    #legenda{display:none;}
    #palco{height:min(62vw,340px);}
  }
</style>
</head>
<body>

<div id="console">
  <div id="palco"><canvas id="tela"></canvas></div>
</div>

<div id="touch">
  <div class="dpad">
    <div class="cima" data-botao="cima">▲</div>
    <div class="esq" data-botao="esq">◀</div>
    <div class="dir" data-botao="dir">▶</div>
    <div class="baixo" data-botao="baixo">▼</div>
  </div>
  <div class="acoes">
    <div data-botao="b">B</div>
    <div data-botao="a">A</div>
  </div>
</div>

<div id="legenda">
  <b>Setas</b> andar &nbsp;·&nbsp; <b>Z</b> confirmar / falar &nbsp;·&nbsp; <b>X</b> voltar / menu
</div>

<script src="src/font.js"></script>
<script src="src/sprites.js"></script>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/world.js"></script>
<script src="src/battle.js"></script>
<script src="src/main.js"></script>
</body>
</html>
